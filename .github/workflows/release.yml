name: Release
on:
  push:
    tags: ['edition-*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended
      - run: |
          ls front-matter/*.md chapters/*.md
          pandoc front-matter/*.md chapters/*.md --pdf-engine=pdflatex --toc --output=book.pdf \
            --metadata title="$(head -1 README.md | sed 's/# //')" \
            --metadata author="Jesús Ariel González Bonilla"
      - uses: softprops/action-gh-release@v2
        with:
          files: book.pdf
          generate_release_notes: true
